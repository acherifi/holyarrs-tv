name: build
on:
  push:
    branches: [main]
    paths-ignore: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-tvos
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          brew install xcodegen
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version
          xcrun simctl list runtimes | grep -i tvos || true
      - name: Generate project
        run: xcodegen generate
      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild -project HolyArrsTV.xcodeproj -scheme HolyArrsTV \
            -destination 'generic/platform=tvOS Simulator' -configuration Debug \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E 'error:|warning: .*HolyArrsTV|BUILD' || true
          grep -q 'BUILD SUCCEEDED' build.log
      - name: Build for device (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project HolyArrsTV.xcodeproj -scheme HolyArrsTV \
            -destination 'generic/platform=tvOS' -configuration Release \
            -derivedDataPath build-dev CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build-device.log | grep -E 'error:|BUILD' || true
          grep -q 'BUILD SUCCEEDED' build-device.log
      - name: Screenshots in simulator
        if: success()
        run: ./ci/screenshots.sh
      - name: Publish results to ci-results branch
        if: always()
        run: |
          mkdir -p out && cp -f build.log build-device.log out/ 2>/dev/null || true
          cp -f shots/*.png out/ 2>/dev/null || true
          cp -rf shots/crashes out/ 2>/dev/null || true
          echo "${{ github.sha }} ${{ job.status }}" > out/STATUS
          cd out
          git init -q -b ci-results
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm "results for ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-results
